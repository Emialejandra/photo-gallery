
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Photo Gallery</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Photo Gallery</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      @for (
        photo of photoService.photos();
        track photo.filepath;
        let position = $index
      ) {
        <ion-col size="6">
          <img
            [src]="photo.webviewPath"
            [attr.alt]="'Photo ' + (position + 1)"
            loading="lazy"
          />

          <ion-button
            expand="block"
            color="danger"
            size="small"
            (click)="deletePhoto(photo.filepath)"
          >
            <ion-icon name="trash" slot="start"></ion-icon>
            Eliminar
          </ion-button>
        </ion-col>
      } @empty {
        <ion-col size="12">
          <p class="empty-message">
            Todavía no tienes fotografías. Pulsa el botón de la cámara para comenzar.
          </p>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button
      (click)="addPhotoToGallery()"
      aria-label="Tomar fotografía"
    >
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
